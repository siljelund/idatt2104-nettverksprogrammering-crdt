name: Build and Test

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  # ─── Linux (GCC) ────────────────────────────────────────────────────────────
  build-linux-gcc:
    name: Linux · GCC
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc g++

      - name: Cache CMake deps
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: linux-gcc-deps-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: linux-gcc-deps-

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure --parallel 4

  # ─── Linux (Clang) ──────────────────────────────────────────────────────────
  build-linux-clang:
    name: Linux · Clang
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang

      - name: Cache CMake deps
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: linux-clang-deps-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: linux-clang-deps-

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=clang++

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure --parallel 4

  # ─── macOS ──────────────────────────────────────────────────────────────────
  build-macos:
    name: macOS · Apple Clang
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install cmake ninja

      - name: Cache CMake deps
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: macos-deps-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: macos-deps-

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure --parallel 4